title: Home # or "Camille Le Roy, Ph.D — Data Scientist & Biologist" to improve the search engine result
seo_title: "Camille Le Roy, Ph.D — Data Scientist & Biologist"
email: ""
description: "Data Scientist • Biologist • Research & Analytics"
url: "https://camille-le-roy.github.io"
breadcrumbs: false # this add a  clickabl "Home/Research" to pages

twitter_username: Camille_Le_Roy
github_username: Camille-Le-Roy
minimal_mistakes_skin: "neon"
search: true

# Social metadata for SEO
social:
  name: "Camille Le Roy"
  links:
    - "https://linkedin.com/in/camille-le-roy-phd"
    - "https://github.com/Camille-Le-Roy"
    - "https://scholar.google.com/citations?user=SP69DnUAAAAJ&hl=en"
    - "https://orcid.org/0000-0003-0421-296X"

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

permalink: /:categories/:title/
timezone: Europe/Paris

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-feed  # optional but recommended

author:
  name   : "Camille Le Roy, Ph.D"
  avatar : "/assets/images/WUR profile picture.JPG"
  bio    : "Data scientist and biologist"
  links:
    - label: "LinkedIn"
      icon: "fa-brands fa-linkedin"
      url: "https://linkedin.com/in/camille-le-roy-phd"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Camille-Le-Roy"
    - label: "Google Scholar"
      icon: "fa-brands fa-google-scholar"
      url: "https://scholar.google.com/citations?user=SP69DnUAAAAJ&hl=en"
    - label: "ORCID"
      icon: "fa-brands fa-orcid"
      url: "https://orcid.org/0000-0003-0421-296X"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide
      css: "/assets/css/custom.css"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
