title: Home # or "Camille Le Roy, Ph.D" to improve the search engine result
email: "  "
description: >-
  Camille Le Roy, Ph.D – Data Scientist and Biologist.

# Social accounts
twitter_username: Camille_Le_Roy
github_username: Camille-Le-Roy
minimal_mistakes_skin: "neon"
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
timezone: Europe/Paris

include:
  - _pages

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag 

author:
  name   : "Camille Le Roy, Ph.D"
  avatar : "/assets/images/WUR profile picture.JPG"
  bio    : "Data scientist and biologist"
  links:
    - label: "LinkedIn"
      icon: "fa-brands fa-linkedin"
      url: "https://www.linkedin.com/in/camille-le-roy-05786727a/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Camille-Le-Roy"
    - label: "Google Scholar"
      icon: "fa-brands fa-google-scholar"
      url: "https://scholar.google.com/citations?user=SP69DnUAAAAJ&hl=en"
    - label: "ORCID"
      icon: "fa-brands fa-orcid"
      url: "https://orcid.org/0000-0003-0421-296X"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide
      css: "/assets/css/custom.css"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
